name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/tunectl-linux-amd64 ./cmd/tunectl

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o dist/tunectl-linux-arm64 ./cmd/tunectl

          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -o dist/tunectl-linux-armv7 ./cmd/tunectl

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tunectl-linux-amd64
            dist/tunectl-linux-arm64
            dist/tunectl-linux-armv7
          generate_release_notes: true
