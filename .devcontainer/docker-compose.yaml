services:
  tunectl:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: tunectl-dev
    volumes:
      - ..:/workspaces/tunectl
      - ~/.gitconfig:/home/vscode/.gitconfig:ro
      - ~/.ssh:/home/vscode/.ssh:ro
      - ~/Music:/home/vscode/Music
    working_dir: /workspaces/tunectl
    command: sleep infinity
    user: vscode
    restart: unless-stopped